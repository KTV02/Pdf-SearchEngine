name: Authorization tests

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/authorization.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/authorization.yml'

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the application test image
        run: docker build --tag pdfsearch-tests --file app/tests/Dockerfile.test app
      - name: Run the offline application tests
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/app/frontend/index.html,dst=/app/frontend/index.html,readonly" \
            pdfsearch-tests pytest -q -m 'not integration' /app/tests
